[workspace]
resolver = "2"
members = [
    "crates/micli",
    "crates/core",
    "crates/manifest",
    "crates/trace",
    "crates/store",
    "crates/sandbox",
    "crates/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
proptest = "1.7"
tempfile = "3"

micli-core = { path = "crates/core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
